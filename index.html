<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO Board</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F8F8FF;
            min-height: 100vh;
            padding: 32px 20px;
            color: #1a1a2e;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 24px;
            text-align: center;
            color: #1a1a2e;
            letter-spacing: -0.5px;
        }
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }
        .input-group input {
            flex: 1;
            padding: 10px 16px;
            border: 1.5px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            background: white;
        }
        .input-group input:focus {
            border-color: #FF2400;
        }
        .input-group button {
            padding: 10px 20px;
            background: #FF2400;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .input-group button:hover {
            background: #d61e00;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .column {
            background: white;
            border-radius: 8px;
            padding: 16px;
            min-height: 300px;
            border: 1.5px solid #eee;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .column.drag-over {
            border-color: #FF2400;
            box-shadow: inset 0 0 0 1.5px #FF2400;
        }
        .column-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1.5px solid #f0f0f0;
        }
        .column-header .count {
            margin-left: auto;
            background: #f5f5f5;
            padding: 1px 10px;
            border-radius: 10px;
            font-size: 12px;
            color: #888;
            font-weight: 500;
        }
        .column-header h2 {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a2e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .task-list {
            min-height: 200px;
        }
        .task {
            background: white;
            border: 1.5px solid #eee;
            border-radius: 6px;
            padding: 12px 14px;
            margin-bottom: 8px;
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }
        .task:hover {
            border-color: #ddd;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .task:active {
            cursor: grabbing;
        }
        .task.dragging {
            opacity: 0.3;
            transform: scale(0.95);
        }
        .task .text {
            flex: 1;
            font-size: 14px;
            color: #333;
            line-height: 1.4;
        }
        .task .delete {
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            font-size: 15px;
            padding: 0 4px;
            transition: color 0.15s;
            opacity: 0;
        }
        .task:hover .delete {
            opacity: 1;
        }
        .task .delete:hover {
            color: #FF2400;
        }
        .placeholder {
            color: #bbb;
            text-align: center;
            padding: 40px 0;
            font-size: 13px;
        }
        @media (max-width: 768px) {
            .board { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TODO Board</h1>
        <div class="input-group">
            <input type="text" id="todoInput" placeholder="Что нужно сделать?" autofocus>
            <button onclick="addTask()">Добавить</button>
        </div>
        <div class="board" id="board">
            <div class="column" data-status="todo" ondrop="drop(event)" ondragover="allowDrop(event)">
                <div class="column-header">
                    <h2>Нужно сделать</h2>
                    <span class="count" id="count-todo">0</span>
                </div>
                <div class="task-list" id="list-todo"></div>
            </div>
            <div class="column" data-status="in_progress" ondrop="drop(event)" ondragover="allowDrop(event)">
                <div class="column-header">
                    <h2>В процессе</h2>
                    <span class="count" id="count-in_progress">0</span>
                </div>
                <div class="task-list" id="list-in_progress"></div>
            </div>
            <div class="column" data-status="done" ondrop="drop(event)" ondragover="allowDrop(event)">
                <div class="column-header">
                    <h2>Готово</h2>
                    <span class="count" id="count-done">0</span>
                </div>
                <div class="task-list" id="list-done"></div>
            </div>
        </div>
    </div>
    <script>
        let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
        let draggedId = null;

        function save() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            render();
        }

        function addTask() {
            const input = document.getElementById('todoInput');
            const text = input.value.trim();
            if (!text) return;
            tasks.push({ id: Date.now(), text, status: 'todo' });
            input.value = '';
            save();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            save();
        }

        function allowDrop(e) {
            e.preventDefault();
        }

        function dragStart(e, id) {
            draggedId = id;
            const el = e.target;
            el.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setDragImage(el, e.offsetX, e.offsetY);
        }

        function dragEnd(e) {
            e.target.classList.remove('dragging');
            document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over'));
        }

        function dragEnter(e) {
            e.currentTarget.classList.add('drag-over');
        }

        function dragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function drop(e) {
            e.preventDefault();
            const column = e.currentTarget;
            column.classList.remove('drag-over');
            const newStatus = column.dataset.status;
            const task = tasks.find(t => t.id === draggedId);
            if (task && task.status !== newStatus) {
                task.status = newStatus;
                save();
            }
            draggedId = null;
        }

        function render() {
            const lists = {
                todo: document.getElementById('list-todo'),
                in_progress: document.getElementById('list-in_progress'),
                done: document.getElementById('list-done')
            };

            ['todo', 'in_progress', 'done'].forEach(status => {
                const items = tasks.filter(t => t.status === status);
                document.getElementById(`count-${status}`).textContent = items.length;

                lists[status].innerHTML = items.length === 0
                    ? '<div class="placeholder">Перетащите задачу сюда</div>'
                    : items.map(t => `
                        <div class="task" draggable="true"
                             ondragstart="dragStart(event, ${t.id})"
                             ondragend="dragEnd(event)">
                            <span class="text">${escapeHtml(t.text)}</span>
                            <button class="delete" onclick="deleteTask(${t.id})">&#10005;</button>
                        </div>
                    `).join('');
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        document.getElementById('todoInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        document.querySelectorAll('.column').forEach(col => {
            col.addEventListener('dragenter', dragEnter);
            col.addEventListener('dragleave', dragLeave);
        });

        render();
    </script>
</body>
</html>
