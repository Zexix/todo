<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            padding: 32px;
        }
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 24px;
            text-align: center;
        }
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }
        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: #667eea;
        }
        .input-group button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .input-group button:hover {
            background: #5a6fd6;
        }
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            justify-content: center;
        }
        .filters button {
            padding: 6px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .filters button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .filters button:hover:not(.active) {
            background: #f5f5f5;
        }
        .todo-list {
            list-style: none;
        }
        .todo-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            gap: 12px;
        }
        .todo-item:last-child {
            border-bottom: none;
        }
        .todo-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }
        .todo-item .text {
            flex: 1;
            font-size: 16px;
            color: #333;
            transition: all 0.2s;
        }
        .todo-item .text.done {
            text-decoration: line-through;
            color: #999;
        }
        .todo-item .delete {
            padding: 4px 8px;
            background: none;
            border: none;
            color: #ff4757;
            cursor: pointer;
            font-size: 18px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .todo-item .delete:hover {
            opacity: 1;
        }
        .counter {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 TODO</h1>
        <div class="input-group">
            <input type="text" id="todoInput" placeholder="Что нужно сделать?" autofocus>
            <button onclick="addTodo()">Добавить</button>
        </div>
        <div class="filters">
            <button class="active" onclick="setFilter('all')">Все</button>
            <button onclick="setFilter('active')">Активные</button>
            <button onclick="setFilter('done')">Выполненные</button>
        </div>
        <ul class="todo-list" id="todoList"></ul>
        <div class="counter" id="counter"></div>
    </div>
    <script>
        let todos = JSON.parse(localStorage.getItem('todos') || '[]');
        let filter = 'all';

        function save() {
            localStorage.setItem('todos', JSON.stringify(todos));
            render();
        }

        function addTodo() {
            const input = document.getElementById('todoInput');
            const text = input.value.trim();
            if (!text) return;
            todos.push({ id: Date.now(), text, done: false });
            input.value = '';
            save();
        }

        function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) { todo.done = !todo.done; save(); }
        }

        function deleteTodo(id) {
            todos = todos.filter(t => t.id !== id);
            save();
        }

        function setFilter(f) {
            filter = f;
            document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
            document.querySelector(`.filters button[onclick*="'${f}'"]`).classList.add('active');
            render();
        }

        function render() {
            const list = document.getElementById('todoList');
            let filtered = todos;
            if (filter === 'active') filtered = todos.filter(t => !t.done);
            if (filter === 'done') filtered = todos.filter(t => t.done);

            list.innerHTML = filtered.map(t => `
                <li class="todo-item">
                    <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTodo(${t.id})">
                    <span class="text ${t.done ? 'done' : ''}">${escapeHtml(t.text)}</span>
                    <button class="delete" onclick="deleteTodo(${t.id})">✕</button>
                </li>
            `).join('');

            const done = todos.filter(t => t.done).length;
            document.getElementById('counter').textContent = `✅ ${done} / ${todos.length} выполнено`;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        document.getElementById('todoInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTodo();
        });

        render();
    </script>
</body>
</html>
